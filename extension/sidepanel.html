<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Mistake Ledger</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; width: 320px; }
    textarea { width: 100%; height: 160px; font-family: monospace; font-size: 12px; box-sizing: border-box; }
    button { margin-top: 8px; padding: 6px 12px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    #verdict-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #eee; margin-bottom: 8px; font-size: 12px; }
    #feedback { margin-top: 12px; font-size: 13px; white-space: pre-wrap; }
    p.hint { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h3>Post-Solve Mistake Ledger</h3>
  <div id="verdict-badge">No verdict yet</div>
  <p class="hint">Paste your submitted code below. Analyze unlocks only after a verdict is detected on the LeetCode page.</p>
  <textarea id="code-input" placeholder="Paste your code here"></textarea>
  <br />
  <button id="analyze-btn" disabled>Analyze</button>
  <div id="feedback"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
