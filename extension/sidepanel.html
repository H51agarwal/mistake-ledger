<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Mistake Ledger</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; width: 320px; }
    button { margin-top: 8px; margin-right: 6px; padding: 6px 12px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    #verdict-badge, #watch-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #eee; margin-bottom: 8px; font-size: 12px; }
    #feedback { margin-top: 12px; font-size: 13px; white-space: pre-wrap; }
    p.hint { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h3>Post-Solve Mistake Ledger</h3>
  <div id="watch-badge">Not watching</div>
  <div id="verdict-badge">No verdict yet</div>
  <p class="hint">
    Click Watch tab. Chrome will ask which screen to share — choose the LeetCode tab, not the whole screen.
    Analyze unlocks only after you submit on LeetCode and at least one silent screenshot is stored.
  </p>
  <button id="watch-btn">Watch tab</button>
  <button id="analyze-btn" disabled>Analyze</button>
  <div id="feedback"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
